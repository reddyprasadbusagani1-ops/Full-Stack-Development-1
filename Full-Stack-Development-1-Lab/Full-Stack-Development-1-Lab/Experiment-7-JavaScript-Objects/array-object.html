<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Array Object</title></head><body><h1>Array Methods</h1><pre id="result"></pre>
<script>const fruits = ["Apple", "Banana", "Mango"]; const initial = fruits.join(", "); fruits.push("Orange"); const removed = fruits.pop(); fruits.sort(); document.getElementById("result").textContent = "Initial: " + initial + "\nAfter push and pop: " + fruits.join(", ") + "\nRemoved: " + removed + "\nLength: " + fruits.length;</script></body></html>
