<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CSS Box Model</title>
<style>body{font-family:Arial}.box{width:280px;background:#d9ead3;border:8px solid #38761d;padding:24px;margin:35px}.label{font-size:14px;color:#555}</style></head><body>
<h1>CSS Box Model</h1><p>The CSS box model consists of content, padding, border and margin.</p>
<div class="box"><strong>Content area</strong><p>This text is the content.</p><span class="label">Padding: 24px · Border: 8px · Margin: 35px</span></div>
</body></html>
