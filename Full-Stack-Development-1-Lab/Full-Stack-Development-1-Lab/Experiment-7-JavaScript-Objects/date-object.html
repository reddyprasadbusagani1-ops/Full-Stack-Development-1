<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Date Object</title></head><body><h1>Date Object</h1><pre id="result"></pre>
<script>const today = new Date(); document.getElementById("result").textContent = "Current date/time: " + today.toString() + "\nYear: " + today.getFullYear() + "\nMonth (1-12): " + (today.getMonth() + 1) + "\nDay of month: " + today.getDate() + "\nWeekday (0=Sunday): " + today.getDay();</script></body></html>
