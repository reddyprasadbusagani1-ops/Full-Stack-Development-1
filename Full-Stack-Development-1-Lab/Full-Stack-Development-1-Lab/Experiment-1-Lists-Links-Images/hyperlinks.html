<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Hyperlinks</title></head><body>
<h1>Hyperlinks using the anchor tag</h1>
<p><a href="https://www.google.com" target="_blank" rel="noopener">Open Google in a new tab</a></p>
<p><a href="https://www.wikipedia.org" target="_self">Open Wikipedia in this tab</a></p>
<p><a href="#contact">Go to Contact section</a></p>
<h2 style="margin-top:500px" id="contact">Contact</h2><p>This is the target section.</p>
</body></html>
