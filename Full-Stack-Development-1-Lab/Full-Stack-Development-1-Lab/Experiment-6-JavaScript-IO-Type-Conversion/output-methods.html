<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>JavaScript Output</title></head><body>
<h1>Ways to Display Output</h1><p id="content"></p>
<script>
document.getElementById("content").textContent = "1. Output with textContent.";

</script></body></html>
