<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Weekday Switch</title></head><body><h1>Weekday using switch</h1><label>Enter day number (1–7): <input id="day" type="number" min="1" max="7"></label><button id="show">Display day</button><p id="result"></p>
<script>document.getElementById("show").onclick = () => { let day; switch(Number(document.getElementById("day").value)){case 1:day="Sunday";break;case 2:day="Monday";break;case 3:day="Tuesday";break;case 4:day="Wednesday";break;case 5:day="Thursday";break;case 6:day="Friday";break;case 7:day="Saturday";break;default:day="Enter a number from 1 to 7";} document.getElementById("result").textContent=day; };</script></body></html>
