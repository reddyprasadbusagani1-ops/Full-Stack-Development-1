<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Armstrong Number</title></head><body><h1>Armstrong Number Check</h1><label>Enter a non-negative integer: <input id="number" type="number" min="0" step="1"></label><button id="check">Check</button><p id="result"></p>
<script>document.getElementById("check").onclick=()=>{const raw=document.getElementById("number").value;const n=Number(raw);if(raw.trim()===""||!Number.isInteger(n)||n<0){document.getElementById("result").textContent="Enter a non-negative integer.";return;}const digits=String(n).split("");const sum=digits.reduce((total,digit)=>total+Math.pow(Number(digit),digits.length),0);document.getElementById("result").textContent=sum===n?n+" is an Armstrong number.":n+" is not an Armstrong number.";};</script></body></html>
