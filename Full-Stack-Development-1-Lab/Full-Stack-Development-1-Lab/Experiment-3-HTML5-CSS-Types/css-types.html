<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Types of CSS</title>
<link rel="stylesheet" href="styles.css">
<style>.internal-style{color:darkgreen;font-size:20px}</style></head><body>
<h1>Inline, Internal and External CSS</h1>
<p style="color:crimson;font-weight:bold">This paragraph uses inline CSS: selector is the paragraph element, property is color/font-weight, values are crimson/bold.</p>
<p class="internal-style">This paragraph uses internal CSS from the style element.</p>
<p class="external-style">This paragraph uses external CSS from styles.css.</p>
</body></html>
