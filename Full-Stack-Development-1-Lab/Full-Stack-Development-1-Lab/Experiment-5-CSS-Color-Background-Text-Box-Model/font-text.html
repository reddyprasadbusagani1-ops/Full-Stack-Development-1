<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Font and Text Properties</title>
<style>body{font-family:Arial;margin:30px}.large{font-size:28px}.bold{font-weight:700}.italic{font-style:italic}.decorated{text-decoration:underline overline}.transformed{text-transform:uppercase}.aligned{text-align:center;background:#eee;padding:15px}</style></head><body>
<h1>CSS Font and Text Properties</h1><p class="large">font-size: 28px</p><p class="bold">font-weight: 700 (bold)</p><p class="italic">font-style: italic</p><p class="decorated">text-decoration: underline and overline</p><p class="transformed">text-transform: uppercase</p><p class="aligned">text-align: center</p>
</body></html>
