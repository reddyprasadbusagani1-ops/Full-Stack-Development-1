<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>CSS Color Formats</title>
<style>body{font-family:Arial}.swatch{padding:18px;margin:10px;color:white}.named{background:tomato}.hex{background:#2878b5}.rgb{background:rgb(40,150,90)}.rgba{background:rgba(120,40,170,.8)}.hsl{background:hsl(35,90%,45%)}.transparent{background:transparent;color:#222;border:2px solid #777}</style></head><body>
<h1>Ways to Specify CSS Colors</h1><div class="swatch named">Named color: tomato</div><div class="swatch hex">Hex: #2878b5</div><div class="swatch rgb">RGB: rgb(40, 150, 90)</div><div class="swatch rgba">RGBA: rgba(120, 40, 170, 0.8)</div><div class="swatch hsl">HSL: hsl(35, 90%, 45%)</div><div class="swatch transparent">Transparent background</div>
</body></html>
