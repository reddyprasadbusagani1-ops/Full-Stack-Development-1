<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Loops 1 to 10</title></head><body><h1>For, While and Do-While Loops</h1><pre id="result"></pre>
<script>let output="For loop: ";for(let i=1;i<=10;i++)output+=i+" ";output+="\nWhile loop: ";let j=1;while(j<=10){output+=j+" ";j++;}output+="\nDo-while loop: ";let k=1;do{output+=k+" ";k++;}while(k<=10);document.getElementById("result").textContent=output;</script></body></html>
