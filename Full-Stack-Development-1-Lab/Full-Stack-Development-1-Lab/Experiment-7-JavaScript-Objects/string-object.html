<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>String Object</title></head><body><h1>String Methods</h1><pre id="result"></pre>
<script>const text = "Full Stack Development"; document.getElementById("result").textContent = "Original: " + text + "\nLength: " + text.length + "\nUppercase: " + text.toUpperCase() + "\nLowercase: " + text.toLowerCase() + "\nIncludes Stack: " + text.includes("Stack") + "\nSlice: " + text.slice(0, 9);</script></body></html>
