<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Largest of Three</title></head><body><h1>Largest of Three Integers</h1><button id="run">Enter three integers</button><p id="result"></p>
<script>document.getElementById("run").onclick = () => { const values = []; for (let i=1;i<=3;i++){ const raw=prompt("Enter integer "+i+":"); if(raw===null)return; if(raw.trim()==="" || !/^-?\d+$/.test(raw.trim())){alert("Please enter valid integers.");return;} values.push(Number(raw)); } const message = values[0]===values[1] && values[1]===values[2] ? "EQUAL NUMBERS" : Math.max(...values)+" LARGER NUMBER"; document.getElementById("result").textContent=message; alert(message); };</script></body></html>
