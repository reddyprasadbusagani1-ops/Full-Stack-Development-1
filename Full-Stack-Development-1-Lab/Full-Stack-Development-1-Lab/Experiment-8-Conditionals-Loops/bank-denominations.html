<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Bank Denominations</title></head><body><h1>Bank Denominations</h1><label>Enter amount in rupees: <input id="amount" type="number" min="0" step="1"></label><button id="calculate">Calculate</button><pre id="result"></pre>
<script>document.getElementById("calculate").onclick=()=>{const raw=document.getElementById("amount").value;let amount=Number(raw);if(raw.trim()===""||!Number.isSafeInteger(amount)||amount<0){document.getElementById("result").textContent="Enter a valid non-negative whole amount.";return;}const denominations=[100,50,20,10,5,2,1];let out="";for(const note of denominations){const count=Math.floor(amount/note);if(count>0){out+=count+" - "+note+"'s\n";amount%=note;}}document.getElementById("result").textContent=out||"Amount is zero.";};</script></body></html>
