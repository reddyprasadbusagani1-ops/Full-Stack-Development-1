<h1>Three-Part Layout Using HTML5</h1><p>HTML5 uses iframe or CSS layouts instead of the obsolete frameset element.</p>
<div class="layout">
<section class="panel"><h2>Image</h2><img src="https://picsum.photos/seed/frame/180/130" alt="Sample" width="180" height="130"></section>
<section class="panel"><h2>Paragraph</h2><p>Frames historically divided a browser window into independent sections. This responsive CSS layout demonstrates a similar three-part page.</p></section>
<section class="panel"><h2>Hyperlink</h2><a href="https://developer.mozilla.org/" target="_blank" rel="noopener">HTML learning resource</a></section>
</div></body></html>
