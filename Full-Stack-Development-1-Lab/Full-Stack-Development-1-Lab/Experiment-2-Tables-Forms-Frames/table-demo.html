<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>HTML Table</title>
<style>table{border-collapse:collapse}th,td{border:1px solid #333;padding:10px;text-align:center}</style></head><body>
<h1>Table with Rowspan and Colspan</h1>
<table>
<caption>Student Marks</caption>
<tr><th rowspan="2">Roll No.</th><th rowspan="2">Name</th><th colspan="3">Marks</th></tr>
<tr><th>HTML</th><th>CSS</th><th>JavaScript</th></tr>
<tr><td>101</td><td>Ravi</td><td>85</td><td>80</td><td>90</td></tr>
<tr><td>102</td><td>Sita</td><td>88</td><td>92</td><td>86</td></tr>
</table></body></html>
