<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Voter Eligibility</title></head><body>
<h1>Voter Eligibility Check</h1><button id="check">Enter voter details</button><table border="1" cellpadding="10"><thead><tr><th>Name</th><th>Age</th><th>Eligibility</th></tr></thead><tbody id="result"></tbody></table>
<script>
document.getElementById("check").addEventListener("click", () => {
 const name = prompt("Enter your name:");
 if (name === null) return;
 const ageText = prompt("Enter your age:");
 if (ageText === null) return;
 const age = Number(ageText);
 const valid = ageText.trim() !== "" && Number.isFinite(age) && Number.isInteger(age) && age >= 0;
 const eligibility = valid ? (age >= 18 ? "Eligible to vote" : "Not eligible to vote") : "Invalid age";
 document.getElementById("result").innerHTML = "";
 const row = document.createElement("tr");
 [name.trim() || "(No name)", valid ? age : ageText, eligibility].forEach(value => {
   const cell = document.createElement("td"); cell.textContent = value; row.appendChild(cell);
 });
 document.getElementById("result").appendChild(row);
});
</script></body></html>
